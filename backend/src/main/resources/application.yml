spring:
  application:
    name: petly-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:petly}
    username: ${POSTGRES_USER:petly}
    password: ${POSTGRES_PASSWORD:petly_dev_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

petly:
  auth:
    otp-hmac-secret: ${PETLY_OTP_HMAC_SECRET}
  jwt:
    secret: ${PETLY_JWT_SECRET}
    expiration-seconds: 900

server:
  address: 0.0.0.0
  port: 8080